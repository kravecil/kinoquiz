<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120709" />
    <title>КиноКвиз</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23d4a24c'/%3E%3Ccircle cx='16' cy='9' r='3.5' fill='%23120709'/%3E%3Ccircle cx='16' cy='23' r='3.5' fill='%23120709'/%3E%3Ccircle cx='9' cy='16' r='3.5' fill='%23120709'/%3E%3Ccircle cx='23' cy='16' r='3.5' fill='%23120709'/%3E%3C/svg%3E" />
    <style>
      /* Экран загрузки до того, как подгрузятся скрипты и стили. */
      html, body { margin: 0; background: #1a0509; }
      .boot { display: grid; place-items: center; min-height: 100vh; }
      .boot__reel { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #c9973f; animation: spin 1.2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__reel"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
